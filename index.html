<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Unmatched Counter</title>
    <style>
      /* Loading splash shown between first paint and React mounting (notably
         when an installed PWA reopens). It lives inside #root, so React wipes
         it automatically on mount. Inline here so it appears before the JS
         bundle loads. */
      html,
      body {
        margin: 0;
        background: #121212;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #121212;
      }
      #app-splash img {
        width: min(45vw, 45vh, 220px);
        height: auto;
        filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.6));
      }
      #app-splash .app-splash__spinner {
        width: 38px;
        height: 38px;
        border: 4px solid rgba(255, 255, 255, 0.18);
        border-top-color: #2db7b7;
        border-radius: 50%;
        animation: app-splash-spin 0.8s linear infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img src="./art/ui/logos/app.webp" alt="Unmatched Life Counter" />
        <div class="app-splash__spinner" role="status" aria-label="Loading"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
